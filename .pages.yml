media:
  input: public/assets
  output: /assets

content:
  - name: projects
    label: Projects (case studies)
    type: collection
    path: content/projects
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    view:
      fields: [title, year, order, homepage]
      sort: [order]
    fields:
      - { name: title, label: "Project name", type: string, required: true }
      - { name: order, label: "Order (1 shows first)", type: number }
      - { name: homepage, label: "Show on homepage (first 6 by order)", type: boolean }
      - { name: year, label: "Year", type: string }
      - { name: cover, label: "Card image", type: image }
      - { name: video, label: "Card video (optional, plays on the card)", type: file, options: { extensions: [mp4, webm, mov] } }
      - { name: meta, label: "Card line under the title", type: string }
      - { name: categories, label: "Categories (filters: Branding, UI/UX, Websites, Motion, AI agents)", type: select, list: true, options: { values: [Branding, UI/UX, Websites, Motion, AI agents] } }
      - { name: tags, label: "Tags shown on the card", type: string, list: true }
      - { name: summary, label: "Short summary", type: text }
      - { name: role, label: "Your role", type: string }
      - { name: work, label: "Work done", type: string, list: true }
      - { name: link, label: "Live website link (optional)", type: string }
      - { name: main_video, label: "Main video (plays with controls on the project page)", type: file, options: { extensions: [mp4, webm, mov] } }
      - { name: video_only, label: "Video only page (hide the extra images, for motion projects)", type: boolean }
      - { name: main_video_poster, label: "Main video still (shown before play)", type: image }
      - { name: hero_image, label: "Top image or video", type: file, options: { extensions: [jpg, jpeg, png, webp, gif, mp4, webm, mov] } }
      - { name: intro_white, label: "Intro (white part)", type: text }
      - { name: intro_muted, label: "Intro (grey part)", type: text }
      - { name: image_wide, label: "Wide image or video", type: file, options: { extensions: [jpg, jpeg, png, webp, gif, mp4, webm, mov] } }
      - { name: problem, label: "The problem", type: text }
      - { name: image_a, label: "Side by side, left (image or video)", type: file, options: { extensions: [jpg, jpeg, png, webp, gif, mp4, webm, mov] } }
      - { name: image_b, label: "Side by side, right (image or video)", type: file, options: { extensions: [jpg, jpeg, png, webp, gif, mp4, webm, mov] } }
      - { name: stat_1, label: "Result number 1 (optional, e.g. 80x)", type: string }
      - { name: stat_1_label, label: "Result number 1 label", type: string }
      - { name: stat_2, label: "Result number 2 (optional)", type: string }
      - { name: stat_2_label, label: "Result number 2 label", type: string }
      - { name: results_white, label: "Results headline", type: string }
      - { name: results_muted, label: "Results text", type: text }
      - { name: gallery, label: "More images or videos (add as many as you like)", type: file, list: true, options: { extensions: [jpg, jpeg, png, webp, gif, mp4, webm, mov] } }
      - { name: body, label: "Extra write up (optional)", type: rich-text }
  - name: blog
    label: Blog posts
    type: collection
    path: content/blog
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    view:
      fields: [title, date]
    fields:
      - { name: title, label: "Title", type: string }
      - { name: category, label: "Category", type: string }
      - { name: date, label: Date, type: date }
      - { name: read, label: Read, type: number }
      - { name: cover, label: "Cover", type: image }
      - { name: excerpt, label: "Excerpt", type: text }
      - { name: lead, label: "Lead", type: text }
      - { name: lead_muted, label: "Lead muted", type: text }
      - { name: detail, label: "Detail", type: text }
      - { name: image, label: "Image", type: image }
      - { name: body, label: Article, type: rich-text }
  - name: settings
    label: "Studio details (email, socials, footer)"
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: studio_name, label: "Studio name", type: string }
      - { name: wordmark, label: "Wordmark", type: string }
      - { name: tagline, label: "Tagline", type: string }
      - { name: font, label: "Font", type: string }
      - { name: founder_name, label: "Founder name", type: string }
      - { name: founder_role, label: "Founder role", type: string }
      - { name: founder_initial, label: "Founder initial", type: string }
      - { name: founder_photo, label: "Founder photo", type: image }
      - { name: founder_portrait, label: "Founder portrait", type: image }
      - { name: email, label: "Email", type: string }
      - { name: location, label: "Location", type: string }
      - { name: timezone, label: "Timezone", type: string }
      - { name: since, label: "Since", type: string }
      - { name: booking_line, label: "Booking line", type: string }
      - { name: slots_line, label: "Slots line", type: string }
      - { name: slots_sub, label: "Slots sub", type: string }
      - name: socials
        label: "Socials"
        type: object
        list: true
        fields:
          - { name: name, label: "Name (X, Instagram or Email)", type: select, options: { values: [X, Instagram, Email] } }
          - { name: url, label: "Link (for Email write mailto:your@email.com)", type: string }
      - { name: copyright, label: "Copyright", type: string }
      - { name: footer_credit, label: "Footer credit", type: string }
      - { name: seo_description, label: "Seo description", type: text }
  - name: home
