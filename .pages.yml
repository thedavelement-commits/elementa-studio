          - { name: title_before, label: "Title before", type: string }
          - { name: rotating_words, label: "Rotating words", type: string, list: true }
          - { name: title_after, label: "Title after", type: string }
          - { name: text, label: "Text", type: text }
          - { name: button, label: "Button", type: string }
          - { name: demo_lead, label: "Demo lead", type: string }
          - { name: demo_strong, label: "Demo strong", type: string }
          - { name: card_text, label: "Card text", type: text }
          - { name: card_name, label: "Card name", type: string }
          - { name: status, label: "Status", type: string }
          - { name: title_highlight, label: "Title highlight", type: string }
      - name: numbers
