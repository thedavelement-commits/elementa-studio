          - { name: title, label: "Title", type: string }
          - { name: value, label: "Value", type: string }
          - { name: value_label, label: "Value label", type: string }
          - { name: meter, label: Meter, type: number }
          - { name: clients, label: "Clients", type: string, list: true }
      - name: statement
