          - { name: title_hl, label: "Title hl", type: string }
          - { name: title_b, label: "Title b", type: string }
          - { name: stat_1, label: "Stat 1", type: string }
          - { name: stat_1_label, label: "Stat 1 label", type: string }
          - { name: stat_2, label: "Stat 2", type: string }
          - { name: stat_2_suffix, label: "Stat 2 suffix", type: string }
          - { name: stat_2_label, label: "Stat 2 label", type: string }
          - { name: text_a, label: "Text a", type: text }
          - { name: text_b, label: "Text b", type: text }
